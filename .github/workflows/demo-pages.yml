# Publica a DEMONSTRAÇÃO estática do KeyLingo (sem servidor/banco) no GitHub Pages.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo no GitHub Pages

on:
  push:
    branches: [main, claude/quirky-johnson-r68juo]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Permissões mínimas: o padrão é só leitura; apenas o job de publicação recebe escrita no Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
